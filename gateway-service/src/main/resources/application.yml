server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: modushield-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        - id: demo-api
          uri: ${DEMO_API_URL:http://localhost:8081}
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: never

modushield:
  access:
    api-key: ${MODUSHIELD_API_KEY:}
  auth:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
  limits:
    max-request-size-bytes: ${MAX_REQUEST_SIZE_BYTES:8192}
    rate-limit-capacity: ${RATE_LIMIT_CAPACITY:5}
    rate-limit-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:10}
